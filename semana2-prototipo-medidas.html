<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amuebl-AR — Cotizador</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; background: #faf7f2; color: #2a2a2a; max-width: 480px; }
  h1 { font-size: 1.25rem; margin-bottom: 4px; }
  .subtitulo { font-size: 0.85rem; color: #777; margin-bottom: 16px; }
  model-viewer {
    width: 100%;
    height: 48vh;
    background-color: #eee;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .campo { margin-bottom: 10px; }
  label { display: block; font-size: 0.85rem; margin-bottom: 4px; font-weight: 600; }
  input[type="number"] {
    width: 100%;
    padding: 8px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }
  .error { color: #b00020; font-size: 0.8rem; min-height: 1em; }
  .resumen {
    margin-top: 12px;
    padding: 10px 12px;
    background: #eef5ee;
    border-radius: 6px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

  <h1>Amuebl-AR</h1>
  <p class="subtitulo">Cotizador de muebles a medida en realidad aumentada</p>

  <model-viewer id="visor"
    src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Box/glTF-Binary/Box.glb"
    alt="Mueble a medida"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    shadow-intensity="1">
  </model-viewer>

  <div class="campo">
    <label for="ancho">Ancho (cm)</label>
    <input type="number" id="ancho" value="80" min="20" max="300" step="1">
  </div>
  <div class="campo">
    <label for="alto">Alto (cm)</label>
    <input type="number" id="alto" value="75" min="20" max="250" step="1">
  </div>
  <div class="campo">
    <label for="fondo">Fondo (cm)</label>
    <input type="number" id="fondo" value="60" min="20" max="200" step="1">
  </div>

  <p class="error" id="errorMsg"></p>

  <div class="resumen" id="resumen">Medidas: 80 × 75 × 60 cm</div>

  <script>
    const visor = document.getElementById('visor');
    const anchoInput = document.getElementById('ancho');
    const altoInput = document.getElementById('alto');
    const fondoInput = document.getElementById('fondo');
    const errorMsg = document.getElementById('errorMsg');
    const resumen = document.getElementById('resumen');

    const LIMITES = {
      ancho: { min: 20, max: 300 },
      alto:  { min: 20, max: 250 },
      fondo: { min: 20, max: 200 }
    };

    function validar(valor, limite) {
      return valor >= limite.min && valor <= limite.max;
    }

    function actualizar() {
      const anchoCm = Number(anchoInput.value);
      const altoCm = Number(altoInput.value);
      const fondoCm = Number(fondoInput.value);

      const anchoOk = validar(anchoCm, LIMITES.ancho);
      const altoOk = validar(altoCm, LIMITES.alto);
      const fondoOk = validar(fondoCm, LIMITES.fondo);

      if (!anchoOk || !altoOk || !fondoOk) {
        errorMsg.textContent =
          `Rango permitido — ancho ${LIMITES.ancho.min}-${LIMITES.ancho.max} cm, ` +
          `alto ${LIMITES.alto.min}-${LIMITES.alto.max} cm, ` +
          `fondo ${LIMITES.fondo.min}-${LIMITES.fondo.max} cm.`;
        return;
      }
      errorMsg.textContent = '';

      const sx = anchoCm / 100;
      const sy = altoCm / 100;
      const sz = fondoCm / 100;

      visor.setAttribute('scale', `${sx} ${sy} ${sz}`);
      resumen.textContent = `Medidas: ${anchoCm} × ${altoCm} × ${fondoCm} cm`;
    }

    [anchoInput, altoInput, fondoInput].forEach(input => {
      input.addEventListener('input', actualizar);
    });

    visor.addEventListener('load', actualizar);
  </script>

</body>
</html>

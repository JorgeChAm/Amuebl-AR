<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amuebl-AR</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; background: #faf7f2; color: #2a2a2a; max-width: 480px; }
  h1 { font-size: 1.25rem; margin-bottom: 4px; }
  .subtitulo { font-size: 0.85rem; color: #777; margin-bottom: 16px; }
  model-viewer {
    width: 100%;
    height: 55vh;
    background-color: #eee;
    border-radius: 8px;
  }
  .nota { margin-top: 14px; font-size: 0.8rem; color: #888; line-height: 1.4; }
</style>
</head>
<body>

  <h1>Amuebl-AR</h1>
  <p class="subtitulo">Visor de muebles en realidad aumentada</p>

  <model-viewer
    src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Box/glTF-Binary/Box.glb"
    alt="Mueble en realidad aumentada"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1">
  </model-viewer>

  <p class="nota">Toca el ícono de realidad aumentada para colocar el mueble en tu espacio a escala real.</p>

</body>
</html>
